site_name: PyColDB
site_url: https://robcox2910.github.io/pycoldb/
site_description: "Build your own column-family database in Python: keyspaces, column families, TTLs and tombstones like Cassandra, explained for learners."
repo_url: https://github.com/robcox2910/pycoldb
repo_name: robcox2910/pycoldb

# theme:start
theme:
  name: material
  custom_dir: overrides
  palette:
    - scheme: default
      primary: deep-purple
      accent: amber
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: deep-purple
      accent: amber
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - content.code.copy
    - navigation.sections
    - navigation.expand
    - toc.integrate
    - search.highlight

# Social cards need cairo, so they are off unless SOCIAL_CARDS is set (the
# shared docs workflow sets it). A repo must not add its own plugins key.
plugins:
  - search
  - social:
      enabled: !ENV [SOCIAL_CARDS, false]
# theme:end

exclude_docs: |
  superpowers/

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.inlinehilite
  - tables

nav:
  - Home: index.md
  - Column Families -- Gradebooks: concepts/column_families.md
  - Columns -- The Building Blocks: concepts/columns.md
  - Compaction -- Cleaning Up: concepts/compaction.md
  - Keyspaces -- The Whole School: concepts/keyspaces.md
  - Rows -- Student Records: concepts/rows.md
  - Saving Safely -- Never Half a File: concepts/saving-safely.md
  - Tombstones -- Crossing Out Instead of Erasing: concepts/tombstones.md
  - TTL -- Temporary Sticky Notes: concepts/ttl.md
  - Property Testing -- Copying Out the Gradebook: property-testing.md
  # series-nav:start
  - The series:
      - Series home: https://robcox2910.github.io/
      - PyOS: https://robcox2910.github.io/py-os/
      - Pebble: https://robcox2910.github.io/pebble-lang/
      - PyDB: https://robcox2910.github.io/pydb/
      - PyKV: https://robcox2910.github.io/pykv/
      - PyDocDB: https://robcox2910.github.io/pydoc-db/
      - PyGraphDB: https://robcox2910.github.io/pygraphdb/
      - PyTSDB: https://robcox2910.github.io/pytsdb/
      - PyVecDB: https://robcox2910.github.io/pyvecdb/
      - "[You are here] PyColDB": https://robcox2910.github.io/pycoldb/
      - PyCrypt: https://robcox2910.github.io/pycrypt/
      - PyNet: https://robcox2910.github.io/pynet/
      - PyWeb: https://robcox2910.github.io/pyweb/
      - PyGit: https://robcox2910.github.io/pygit/
      - PySearch: https://robcox2910.github.io/pysearch/
      - PyMQ: https://robcox2910.github.io/pymq/
      - PyLLM: https://robcox2910.github.io/pyllm/
      - PyScheduler: https://robcox2910.github.io/pyscheduler/
      - PyStack: https://robcox2910.github.io/pystack/
